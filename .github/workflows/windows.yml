# Windows-Desktop (Tauri). Nur manuell starten: Windows-Minuten zaehlen doppelt.
name: Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tauri:
    name: Tauri-Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows/src-tauri
      - run: npm install
      - name: Icons aus dem App-Icon erzeugen
        run: npx tauri icon ../apple/UniFlow/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png -o src-tauri/icons
      - name: Bauen
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: uniflow-windows
          path: |
            apps/windows/src-tauri/target/release/bundle/nsis/*.exe
            apps/windows/src-tauri/Cargo.lock
          retention-days: 14
