# Windows-Desktop (Tauri + mitgeliefertes Python-Backend). Nur manuell starten: Windows-Minuten zaehlen doppelt.
name: Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: Installer (Backend + Tauri)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\apps\windows\backend\ms-playwright
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Python-Abhaengigkeiten und PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Backend-Tests (Starter, CSP, Paketbeschreibung)
        run: python -m pytest -q tests/test_desktop.py
      - name: Chromium fuer Playwright (wird neben die exe gelegt)
        run: python -m playwright install chromium
      - name: Backend packen (PyInstaller, Ordner-Paket)
        run: python -m PyInstaller apps/windows/backend/uniflow-backend.spec --noconfirm --distpath apps/windows/backend/dist
      - name: Chromium ins Paket
        shell: pwsh
        run: |
          Move-Item -Path "apps/windows/backend/ms-playwright" -Destination "apps/windows/backend/dist/uniflow-backend/ms-playwright"
          Get-ChildItem "apps/windows/backend/dist/uniflow-backend" | Select-Object Name, Length
      - name: Gepacktes Backend starten und abfragen
        shell: pwsh
        run: |
          $state = Join-Path $env:TEMP "uniflow-state.json"
          $base = Join-Path $env:TEMP "uniflow-base"
          $p = Start-Process -FilePath "apps/windows/backend/dist/uniflow-backend/uniflow-backend.exe" -ArgumentList "--state `"$state`" --base `"$base`"" -PassThru
          $deadline = (Get-Date).AddSeconds(90)
          while (-not (Test-Path $state) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 300 }
          if (-not (Test-Path $state)) { Stop-Process -Id $p.Id -Force; throw "Backend hat keine Zustandsdatei geschrieben" }
          $url = (Get-Content $state | ConvertFrom-Json).url
          Start-Sleep -Seconds 2
          $r = Invoke-WebRequest -Uri ($url + "api/account/info") -UseBasicParsing
          if ($r.StatusCode -ne 200) { Stop-Process -Id $p.Id -Force; throw "Backend antwortet nicht: $($r.StatusCode)" }
          Write-Host "Backend OK: $($r.Content)"
          $h = Invoke-WebRequest -Uri $url -UseBasicParsing
          if (-not $h.Headers["Content-Security-Policy"]) { Stop-Process -Id $p.Id -Force; throw "Oberflaeche ohne Content-Security-Policy" }
          Stop-Process -Id $p.Id -Force

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows/src-tauri
      - name: Tauri-Abhaengigkeiten
        working-directory: apps/windows
        run: npm install
      - name: Icons aus dem App-Icon erzeugen
        working-directory: apps/windows
        run: npx tauri icon ../apple/UniFlow/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png -o src-tauri/icons
      - name: Installer bauen
        working-directory: apps/windows
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: uniflow-windows
          path: |
            apps/windows/src-tauri/target/release/bundle/nsis/*.exe
            apps/windows/src-tauri/Cargo.lock
          retention-days: 14
