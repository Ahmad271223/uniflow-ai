# Windows-Desktop (Tauri + mitgeliefertes Python-Backend). Windows-Minuten zaehlen doppelt: laeuft nur bei Aenderungen
# an App oder Backend auf develop und auf Zweigen windows/** (Fertigstellung 1.0, 08.11.2026) und sonst von Hand
# (workflow_dispatch). Ergebnis: der NSIS-Installer und das Store-Paket (MSIX) als Artefakte des Laufs.
name: Windows

on:
  push:
    branches: [develop, "windows/**"]
    paths:
      - "apps/windows/**"
      - "app/**"
      - "requirements.txt"
      - "packages/shared-contracts/*.json"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: Installer (Backend + Tauri)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\apps\windows\backend\ms-playwright
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Python-Abhaengigkeiten und PyInstaller
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt bringt pytest fuer den naechsten Schritt (ohne es brach jeder Lauf dort ab)
          python -m pip install -r requirements.txt -r requirements-dev.txt pyinstaller
      # Blockierend: Starter, CSP, Paketbeschreibung, Fenster-Agent, Paketdaten und ein echter Eintrag in der
      # Windows-Anmeldeinformationsverwaltung (tests/test_windows_package.py, Dummy-Token mit eigenem Ziel)
      # tests/test_local_secrets.py: DPAPI-Roundtrip der .env-Geheimnisse laeuft nur hier auf echtem Windows (08.11.2026)
      - name: Backend-Tests (Starter, CSP, Paketbeschreibung, Anmeldeinformationsverwaltung, DPAPI)
        run: python -m pytest -q tests/test_desktop.py tests/test_desktop_windows.py tests/test_windows_package.py tests/test_local_secrets.py
      # Hinweis-Stufe: weitere Windows-relevante Tests (Konto-Pflicht, Huelle, OCR, Studienverlauf). Sie liefen bis
      # 05.11.2026 nie unter Windows; ein Fehler steht in der Zusammenfassung des Laufs, stoppt den Installer aber nicht.
      # Nach dem ersten gruenen Lauf continue-on-error entfernen (docs/release/WINDOWS-BAU-2026-11-05.md).
      - name: Windows-relevante Tests (Hinweis, blockiert nicht)
        shell: pwsh
        continue-on-error: true
        run: |
          python -m pytest -q -p no:cacheprovider tests/test_account_mode.py tests/test_web_windows_shell.py tests/test_pageocr.py `
            tests/test_study_catalog.py tests/test_luh_seed.py tests/test_exam_registration.py tests/test_study_sources_luh.py `
            tests/test_openai_key.py tests/test_shipped_universities.py tests/test_trial_stripe.py 2>&1 | Tee-Object -Variable out
          $code = $LASTEXITCODE
          $last = ($out | Select-Object -Last 1)
          "### Windows-relevante Tests: $(if ($code -eq 0) { 'gruen' } else { 'FEHLER (Exitcode ' + $code + ')' })`n`n$last" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { ($out | Select-String -Pattern '^(FAILED|ERROR) ') | ForEach-Object { "- $($_.Line)" } | Out-File -Append $env:GITHUB_STEP_SUMMARY }
          exit $code
      - name: Chromium fuer Playwright (wird neben die exe gelegt)
        run: python -m playwright install chromium
      - name: Backend packen (PyInstaller, Ordner-Paket)
        run: python -m PyInstaller apps/windows/backend/uniflow-backend.spec --noconfirm --distpath apps/windows/backend/dist
      - name: Chromium ins Paket
        shell: pwsh
        run: |
          # Playwright legt chromium-<build> (und chromium_headless_shell-<build>) unter PLAYWRIGHT_BROWSERS_PATH ab;
          # ohne diesen Ordner wuerde das Paket spaeter still auf Playwrights Standardordner zurueckfallen.
          $browsers = $env:PLAYWRIGHT_BROWSERS_PATH
          $chromium = @(Get-ChildItem -Path $browsers -Directory -Filter "chromium-*" -ErrorAction SilentlyContinue)
          if ($chromium.Count -eq 0) { throw "Kein Ordner chromium-* unter $browsers - 'playwright install chromium' hat nichts abgelegt?" }
          Write-Host "Chromium: $($chromium.Name -join ', ')"
          $target = "apps/windows/backend/dist/uniflow-backend/ms-playwright"
          Move-Item -Path $browsers -Destination $target
          if (-not (Get-ChildItem -Path $target -Directory -Filter "chromium-*")) { throw "Chromium fehlt nach dem Verschieben unter $target" }
          Get-ChildItem "apps/windows/backend/dist/uniflow-backend" | Select-Object Name, Length
      - name: Tesseract fuer die Texterkennung ins Paket (Pruefsummen fest, Probe-Erkennung)
        shell: pwsh
        run: ./apps/windows/scripts/add-tesseract.ps1 -Target apps/windows/backend/dist/uniflow-backend/tesseract
      # Smoke-Test des gepackten Backends: Lebenszeichen (/api/account/info), CSP, Oberflaechen-Dateien, Konto-Pflicht
      # (401 ohne Anmeldung), Token-Ablage = Anmeldeinformationsverwaltung, Anmeldung im Browser mit Loopback-
      # Rueckleitung, Studienverlauf-Daten im Paket. Dieselbe Pruefung laeuft nach der stillen Installation erneut.
      - name: Gepacktes Backend starten und abfragen (Smoke-Test)
        shell: pwsh
        run: ./apps/windows/scripts/check-backend.ps1 -Exe apps/windows/backend/dist/uniflow-backend/uniflow-backend.exe

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows/src-tauri
      - name: Tauri-Abhaengigkeiten
        working-directory: apps/windows
        run: npm install
      - name: Icons aus dem App-Icon erzeugen (apps/windows/app-icon.png)
        working-directory: apps/windows
        run: npx tauri icon app-icon.png -o src-tauri/icons
      - name: Installer bauen
        working-directory: apps/windows
        run: npx tauri build
      # Bekannte Schwachstellen in den Rust-Abhaengigkeiten der App (Cargo.lock aus diesem Bau). Nur Hinweis: ein
      # Befund soll die Auslieferung nicht stoppen, steht aber im Protokoll und in der Zusammenfassung des Laufs.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
        continue-on-error: true
      - name: Rust-Abhaengigkeiten pruefen (cargo audit)
        working-directory: apps/windows/src-tauri
        shell: pwsh
        continue-on-error: true
        run: |
          cargo audit --json > cargo-audit.json
          $r = Get-Content cargo-audit.json -Raw | ConvertFrom-Json
          $n = $r.vulnerabilities.count
          "### cargo audit: $n bekannte Schwachstellen" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          if ($n -gt 0) { $r.vulnerabilities.list | ForEach-Object { "- $($_.advisory.id) $($_.package.name) $($_.package.version): $($_.advisory.title)" } | Out-File -Append $env:GITHUB_STEP_SUMMARY }
      - name: Installer still installieren, installiertes Backend pruefen, deinstallieren
        shell: pwsh
        run: ./apps/windows/scripts/check-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: uniflow-windows
          path: |
            apps/windows/src-tauri/target/release/bundle/nsis/*.exe
            apps/windows/src-tauri/Cargo.lock
            apps/windows/src-tauri/cargo-audit.json
          retention-days: 14
      - name: Zusammenfassung (Version und Artefakte)
        shell: pwsh
        run: |
          $v = (Get-Content apps/windows/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $exe = Get-ChildItem apps/windows/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          "### StudiNow fuer Windows $v`n- Installer: $($exe.Name) ($([math]::Round($exe.Length / 1MB)) MB), Artefakt uniflow-windows`n- MSIX: eigenes Artefakt (Name -msix), falls die MSIX-Schritte gruen sind`n- Commit: $env:GITHUB_SHA" | Out-File -Append $env:GITHUB_STEP_SUMMARY

      # Microsoft Store: MSIX aus derselben App (apps/windows/msix/README.md). Erst nach dem Hochladen des Installers,
      # damit ein Fehler hier den NSIS-Installer nicht verhindert.
      - name: MSIX-Paket (unsigniert fuer Partner Center, dazu testsigniert)
        shell: pwsh
        run: ./apps/windows/scripts/build-msix.ps1 -AppExe apps/windows/src-tauri/target/release/uniflow-desktop.exe -BackendDir apps/windows/backend/dist/uniflow-backend -TestSign
      - name: MSIX testweise installieren, Backend im Paket starten, deinstallieren
        shell: pwsh
        run: ./apps/windows/scripts/check-msix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: uniflow-windows-msix
          path: |
            apps/windows/msix/out/*.msix
            apps/windows/msix/out/*.cer
          retention-days: 14
