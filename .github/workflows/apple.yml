# iPad-App: gemeinsamer Swift-Kern unter Linux (guenstig), danach App-Build und Tests im iOS-Simulator (macOS).
# Kosten: Linux-Minuten zaehlen 1x, macOS-Minuten 10x gegen das Freikontingent privater Repos. Darum laeuft der
# macOS-Job nur, wenn der Linux-Job gruen ist, und nur bei Aenderungen unter apps/apple. Kein Signieren.
# Audit P47 (08.11.2026): Ausloeser auch fuer die gemeinsamen Vertraege/Fixtures und die einzige Datei unter app/, die
# die Swift-Tests lesen (app/static/formats.js, PageFormatsTests); Paritaet mit app/*.py pruefen die Python-Tests
# (python.yml, ohne Pfadfilter). Manuell gestartet und auf main laeuft der iPad-Job auch, wenn der Linux-Job rot ist
# (der Linux-Kern uebersetzt seit dem 07.11. nicht: FoundationNetworking/HTTPCookie, Typpruefung; das ist kein
# iOS-Fehler). Zusammenfassung je Lauf: Commit, Build-Nummer aus project.yml, Zahl der ausgefuehrten Tests.
# Ein gruener Lauf hier ist kein Nachweis fuer das signierte Archiv (docs/release/BUILD-HERKUNFT.md).
name: Apple

on:
  push:
    branches: [develop, main]
    paths:
      - "apps/apple/**"
      - "packages/shared-contracts/**"
      - "app/static/formats.js"
      - ".github/workflows/apple.yml"
  pull_request:
    paths:
      - "apps/apple/**"
      - "packages/shared-contracts/**"
      - "app/static/formats.js"
      - ".github/workflows/apple.yml"
  workflow_dispatch:

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-linux:
    name: UniFlowCore (Linux, swift test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Swift-Version
        run: swift --version
      - name: SQLite-Kopfdateien (CSQLite braucht sqlite3.h, fehlt im swift:6.0-jammy-Abbild)
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev
      - name: Tests
        shell: bash
        timeout-minutes: 15
        working-directory: apps/apple/Packages/UniFlowCore
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-test-linux.log
      - name: Zusammenfassung
        if: always()
        shell: bash
        working-directory: apps/apple/Packages/UniFlowCore
        run: |
          {
            echo "### UniFlowCore unter Linux"
            echo "Commit ${SHA:0:8}"
            echo '```'
            grep -E "Executed [0-9]+ tests" swift-test-linux.log | tail -n 1 || true
            grep -E "error:" swift-test-linux.log | sed -E 's/.*Sources\/UniFlowCore\///' | sort -u | head -15 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          SHA: ${{ github.sha }}
      - name: Protokoll sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-linux
          path: apps/apple/Packages/UniFlowCore/swift-test-linux.log
          retention-days: 30

  ios:
    name: iPad-App (Xcode, Simulator)
    needs: core-linux
    # Push auf develop: nur nach gruenem Linux-Job (macOS zaehlt 10x). Manuell und auf main: auch bei rotem Linux-Job,
    # damit ein Linux-Fehler den iPad-Nachweis nicht verdeckt (P47-07)
    if: ${{ !cancelled() && (needs.core-linux.result == 'success' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: macos-15
    # volle Suite lokal ~13 min (1252 Tests, Mac mit Apple-Chip); Runner langsamer, dazu Bauen: 90 min fuer den Job,
    # Schritte einzeln begrenzt, damit ein Haenger am Schritt erkennbar ist (P47-09)
    timeout-minutes: 90
    defaults:
      run:
        shell: bash            # bash -eo pipefail: ein Fehler vor "| tee" faellt auf
    steps:
      - uses: actions/checkout@v4
      - name: Xcode und Simulatoren
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available
      - name: XcodeGen installieren
        timeout-minutes: 10
        run: brew install xcodegen
      - name: Kern auch auf macOS testen
        timeout-minutes: 20
        working-directory: apps/apple/Packages/UniFlowCore
        run: swift test 2>&1 | tee swift-test-macos.log
      - name: Xcode-Projekt erzeugen
        working-directory: apps/apple
        run: xcodegen generate
      - name: iPad-Simulator waehlen
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          cands = [(rt, d) for rt, ds in devices.items() if "iOS" in rt for d in ds if d["name"].startswith("iPad")]
          def ver(rt):
              tail = rt.split("iOS-")[-1]
              return tuple(int(x) for x in tail.split("-") if x.isdigit())
          def pref(name):   # grosses iPad bevorzugen (Layout wie iPad Pro / Air)
              return 3 if "iPad Pro 13" in name else 2 if "iPad Pro" in name else 1 if "iPad Air" in name else 0
          cands.sort(key=lambda t: (ver(t[0]), pref(t[1]["name"])))
          print(cands[-1][1]["udid"] if cands else "")
          ')
          test -n "$UDID" || { echo "kein iPad-Simulator gefunden"; exit 1; }
          xcrun simctl list devices | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Bauen und testen
        timeout-minutes: 60
        working-directory: apps/apple
        run: |
          set -o pipefail
          xcodebuild test \
            -project UniFlow.xcodeproj -scheme UniFlow \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*(deprecated|unused)|Test Case|Executed|BUILD|\*\*" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log
      - name: Zusammenfassung
        if: always()
        working-directory: apps/apple
        env:
          SHA: ${{ github.sha }}
        run: |
          BUILD=$(sed -nE 's/^ *CURRENT_PROJECT_VERSION: "([0-9]+)"/\1/p' project.yml)
          VERSION=$(sed -nE 's/^ *MARKETING_VERSION: "([^"]+)"/\1/p' project.yml)
          {
            echo "### iPad-App"
            echo "Commit ${SHA:0:8}, Version $VERSION, Build $BUILD (project.yml; Debug, Simulator, ohne Signierung)"
            echo '```'
            echo "Kern macOS: $(grep -E 'Executed [0-9]+ tests' Packages/UniFlowCore/swift-test-macos.log 2>/dev/null | tail -n 1 | sed -E 's/^[[:space:]]+//')"
            echo "UniFlowTests: $(grep -E 'Executed [0-9]+ tests' xcodebuild.log 2>/dev/null | tail -n 1 | sed -E 's/^[[:space:]]+//')"
            grep -E "\*\* TEST (SUCCEEDED|FAILED) \*\*" xcodebuild.log 2>/dev/null | tail -n 1 || echo "kein Testergebnis im Protokoll"
            grep -E "error:|: failed \(" xcodebuild.log 2>/dev/null | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Protokolle klein und 90 Tage (Release-Nachweis je Commit, P47-08), das grosse .xcresult 7 Tage
      - name: Protokolle sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-logs
          path: |
            apps/apple/xcodebuild.log
            apps/apple/Packages/UniFlowCore/swift-test-macos.log
          retention-days: 90
      - name: Ergebnisbuendel sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: apps/apple/TestResults.xcresult
          retention-days: 7
