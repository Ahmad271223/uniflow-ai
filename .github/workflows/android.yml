# Android: Kern (Kotlin/JVM, gemeinsame Vertraege) und App (Jetpack Compose) mit Play-Store-Bundle.
name: Android

on:
  push:
    branches: [develop, main]
    paths:
      - "apps/android/**"
      - "packages/shared-contracts/fixtures/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Android-Kern (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests des Kerns (Konto-Vertrag, Sync-Vertrag, Notizformat, Zusammenfuehrung)
        working-directory: apps/android
        run: ./gradlew :core:test --no-daemon

  app:
    name: Android-App (Compose, Bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests der App (Regeln ohne Geraet) und Debug-APK
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Play-Store-Bundle (unsigniert; Signatur mit dem Schluessel des Inhabers, siehe README)
        working-directory: apps/android
        run: ./gradlew :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: uniflow-android
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
