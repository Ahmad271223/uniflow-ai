# Android-Kern (Kotlin/JVM): gemeinsame Zusammenfuehrungs-Tests. Linux, ohne Android-SDK.
name: Android

on:
  push:
    branches: [develop, main]
    paths:
      - "apps/android/**"
      - "packages/shared-contracts/fixtures/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Android-Kern (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Tests
        run: gradle -p apps/android :core:test --no-daemon
