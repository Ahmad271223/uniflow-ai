name: Community security tests
on:
  push:
    branches:
      - feature/community-foundation-20261028
  pull_request:
    paths:
      - 'app/community_*.py'
      - 'tests/test_community_service.py'
      - '.github/workflows/community-tests.yml'
jobs:
  community:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated community regression tests
        run: python -m unittest discover -s tests -p test_community_service.py -v
