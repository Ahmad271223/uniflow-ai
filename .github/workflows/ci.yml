# Server und Weboberflaeche: Abhaengigkeits-Sicherheitspruefung, Syntaxpruefung der JS-Module (Python-Tests: python.yml).
# Laeuft auf Linux (1x Minuten). Echte Daten und Zugangsdaten werden nie benutzt (Temp-Datenordner in den Tests).
name: CI

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - "apps/apple/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Die Python-Tests laufen seit Audit P47 (08.11.2026) im eigenen Workflow python.yml ohne Pfadfilter: sie lesen auch
  # Swift-Quellen und docs/release/*.md, die dieser Workflow per paths-ignore auslaesst.
  security:
    name: Sicherheitspruefung
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Bekannte Schwachstellen in Abhaengigkeiten (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict
      - name: Bekannte Schwachstellen in der Windows-Werkzeugkette (npm audit)
        working-directory: apps/windows
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Stueckliste der Abhaengigkeiten (SBOM, CycloneDX)
        run: |
          pip install cyclonedx-bom
          mkdir -p sbom
          cyclonedx-py requirements requirements.txt --of JSON -o sbom/python-requirements.cdx.json
          (cd apps/windows && npx --yes @cyclonedx/cyclonedx-npm@4.0.0 --output-file ../../sbom/windows-npm.cdx.json --omit dev || true)
          ls -la sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/*.json
          retention-days: 90
      - name: Keine Zugangsdaten im Repository
        run: |
          test ! -e .env || { echo ".env darf nicht eingecheckt sein"; exit 1; }
          ! git ls-files | grep -E '^(data|logs|backup)/' || { echo "data/, logs/, backup/ duerfen nicht eingecheckt sein"; exit 1; }
          ! git grep -nIE '(STUDIP|QIS|IDM|HILDESHEIM)_PASSWORD=.{4,}|LEARNWEB_TOKE[N]=.{8,}' -- ':!.env.example' ':!tests/' || { echo "Passwort im Code gefunden"; exit 1; }

  frontend:
    name: Weboberflaeche (Syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: ES-Module pruefen
        run: |
          node --version
          mkdir -p /tmp/mjs
          for f in app/static/*.js; do cp "$f" "/tmp/mjs/$(basename "$f" .js).mjs"; done
          for f in /tmp/mjs/*.mjs; do node --check "$f" || exit 1; done
          echo "alle Module syntaktisch korrekt"
      - name: Gemeinsame Zusammenfuehrungs-Tests (Web)
        run: node --test tests/js/*.test.mjs
