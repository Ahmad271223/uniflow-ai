[pytest]
# Nur die Marker stehen hier; es gibt bewusst kein addopts: `python -m pytest` ohne Optionen laesst weiter ALLES
# laufen (auch die Lasttests), nichts wird still uebersprungen. Welcher Lauf wann: docs/TESTLAEUFE.md
markers =
    last: Lasttest - startet viele Prozesse oder Sitzungen zugleich (Liste: tests/lasttests.txt). Schneller Lauf ohne sie: -m "not last" (tools/tests-schnell.sh); voller Lauf mit ihnen: tools/tests-voll.sh
