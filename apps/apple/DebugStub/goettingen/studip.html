<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stud.IP – Anmeldung (Nachbildung Göttingen)</title><style>body{font-family:-apple-system,Helvetica,sans-serif;background:#f3f4f6;margin:0;padding:40px}.box{max-width:460px;margin:0 auto;background:#fff;border:1px solid #d6d9de;border-radius:10px;padding:28px}h1{font-size:22px;margin:0 0 6px}p{color:#555;font-size:14px}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #c9ccd1;border-radius:6px;font-size:15px;margin:8px 0}.button{display:block;width:100%;margin-top:14px;background:#13294b;color:#fff;text-align:center;padding:11px;border:0;border-radius:6px;font-size:15px}.note{font-size:12px;color:#888;margin-top:16px}</style></head><body id="login"><div class="box"><h1>Stud.IP – Anmeldung</h1><p>Nachbildung für den Simulator – keine echte Seite der Universität Göttingen.</p><form class="default login-top" name="login_form" id="login-form" method="post" onsubmit="location.href='studip-angemeldet.html'; return false;"><label><span class="sr-only">Benutzername</span><input type="text" id="loginname" name="loginname" autocomplete="username" placeholder="Benutzername"></label><label><span class="sr-only">Passwort</span><input type="password" id="password" name="password" autocomplete="current-password" placeholder="Passwort"></label><input type="hidden" name="security_token" value="stub"><input type="hidden" name="login_ticket" value="stub"><input type="hidden" name="resolution" value=""><button type="submit" class="button" id="submit_login" name="Login">Anmelden</button></form><p class="note">Im echten Stud.IP stehen daneben „CAS Login“ und „Other Institutes Login“; StudiNow nutzt nur diese Felder.</p></div></body></html>
