<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QIS – Prüfungsverwaltung (Nachbildung)</title>
<style>body{font-family:-apple-system,Helvetica,sans-serif;background:#f3f4f6;margin:0;padding:40px} .box{max-width:460px;margin:0 auto;background:#fff;border:1px solid #d6d9de;border-radius:10px;padding:28px}
h1{font-size:22px;margin:0 0 6px} p{color:#555;font-size:14px} label{display:block;font-size:13px;margin:14px 0 4px;color:#333} input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #c9ccd1;border-radius:6px;font-size:15px}
.btn{display:block;margin-top:18px;background:#1d4ed8;color:#fff;text-align:center;padding:11px;border-radius:6px;text-decoration:none;font-size:15px} .note{font-size:12px;color:#888;margin-top:16px}</style></head>
<body><div class="box"><h1>QIS – Prüfungsverwaltung</h1><p>Nachbildung für den Simulator – keine echte Seite der Hochschule.</p>
<form onsubmit="location.href='qis-angemeldet.html'; return false;">
<label for="asdf">LUH-ID</label><input id="asdf" name="asdf" type="text" autocomplete="username">
<label for="fdsa">Passwort</label><input id="fdsa" name="fdsa" type="password">
<a class="btn" href="qis-angemeldet.html">Anmelden</a></form><p class="note">Im echten QIS heißen die Felder asdf und fdsa.</p></div></body></html>
