# XcodeGen-Projektbeschreibung. Mac: `brew install xcodegen && xcodegen generate`, dann UniFlow.xcodeproj oeffnen.
# CI: .github/workflows/apple.yml erzeugt das Projekt genauso und baut/testet ohne Signierung im Simulator.
name: UniFlow
options:
  bundleIdPrefix: de.uniflow
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
packages:
  UniFlowCore:
    path: Packages/UniFlowCore
  # "Bessere Mitschrift" mit Whisper auf dem Geraet (1.0.8, docs/WHISPER-MITSCHRIFT.md): einziges Fremdpaket der App,
  # MIT-Lizenz, auf eine feste Version gelegt. Gebunden wird nur das Produkt WhisperKit (Kern ohne Server und CLI).
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: 1.1.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    # App Store: 1.0.1 = Build 30 (10.11.2026), 1.0.2 = Build 31 (11.11.2026), 1.0.3 = Build 35 (13.11.2026); 1.0 mit Build 25 wurde nie veroeffentlicht; 1.0.4 = Build 42, eingereicht am 15.11.2026 (Build 41 am 14.11.2026 eingereicht und zurueckgezogen)
    # (docs/release/BUILD-HERKUNFT.md). Build-Nummer: eine fortlaufende ganze Zahl ueber alle Uploads hinweg,
    # je Upload +1, nie zurueck (0.2.0 hatte Build 2). Neue Version (1.0.1, 1.1) -> MARKETING_VERSION, Build weiterzaehlen.
    MARKETING_VERSION: "1.0.8"
    CURRENT_PROJECT_VERSION: "51"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  UniFlow:
    type: application
    platform: iOS
    sources:
      - path: UniFlow
      # Datenformat der Widgets (App schreibt, Widget liest; docs/WIDGETS-2026-11-23.md)
      - path: WidgetShared
      # Lernseiten neben dem Dokument: Grundstock der erlaubten Seiten (docs/VIDEO-LERNSEITEN-2026-11-14.md)
      - path: ../../packages/shared-contracts/learning-sites.json
        buildPhase: resources
    dependencies:
      - package: UniFlowCore
      - package: WhisperKit
        product: WhisperKit
      # Widgets auf Home- und Sperrbildschirm (StudiNowWidgets, eingebettet unter PlugIns)
      - target: StudiNowWidgets
    # Team und "Mit Apple anmelden" nur mit der nicht eingecheckten Config/Team.xcconfig (siehe Config/Base.xcconfig)
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.uniflow.ai
        # iPhone und iPad (Zweig iphone/universal, docs/IPHONE-STAND-2026-11-11.md): eine Universal-App mit gleicher
        # Bundle-ID und gleichen Abos; die Fassung richtet sich nach dem Platz (horizontalSizeClass), nicht nach dem
        # Geraet. Ausnahme: der Editor (Schreiben auf PDFs) bleibt dem iPad vorbehalten (`UFEditorAvailability`).
        TARGETED_DEVICE_FAMILY: "1,2"
        # Mac ueber die iPad-App ("Designed for iPad", Entscheidung 28.10.): kein eigener Mac-Build; freigeschaltet wird
        # es in App Store Connect (Preise und Verfuegbarkeit -> iPhone- und iPad-Apps auf Apple-Silicon-Macs)
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        # die Skriptphase "Nur Debug: lokales Netz" schreibt in die Info.plist des Bundles (unten)
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        # Ausgelieferte Hochschulen (Info.plist UFShippedUniversities, UFReleaseUniversities im Kern). Entscheidung des
        # Inhabers 07.11.2026: Version 1.0 (Build 16) nur die LUH; HsH und Uni Hildesheim bleiben im Code und kommen mit
        # 1.0.1 - dann Release auf "luh hildesheim hsh" setzen. Debug und Tests sehen alle drei.
        # Datei-Eingang (18.11.2026, docs/DATEI-EINGANG-2026-11-18.md): Entscheidung des Inhabers 18.11.2026 abends
        # ("Ja, auch im Store"): Release (TestFlight, App Store, Kabel-Fassungen) bietet ihn an und er ist von selbst AN,
        # Ausschalten in den Einstellungen. Debug bleibt NO (Tests, Simulator): dort geht nie etwas weg.
        # Vor dem Einreichen muessen Nutzungsbedingungen + Datenschutz (Entwuerfe in docs/release) live sein.
        # Uni Goettingen (26.11.2026, docs/GOETTINGEN-2026-11-26.md): Inhaber 26.11.2026 abends „das soll übermorgen mit
        # reinkommen“ - ab dem naechsten Build auch im Release zur Wahl (Stud.IP, Schwarzes Brett, Mensa; Noten usw. folgen).
        Debug:
          UF_SHIPPED_UNIVERSITIES: "luh hildesheim hsh goettingen"
          UF_INTAKE_OFFERED: "NO"
          # Testlauf am Mac ("Designed for iPad", 14.11.2026, docs/MAC-TESTLAUF-EIGENER-ORDNER-2026-11-14.md): am Mac
          # waere der Testwirt sonst dieselbe App wie die installierte (gleiche Kennung = gleicher Datenordner,
          # gleicher Schluesselbund, gleiche Einstellungen) und laese und aenderte die echten Daten des Nutzers.
          # tools/mac-test.sh setzt dafuer UF_DEBUG_BUNDLE_ID=de.uniflow.ai.mactest. Nur Debug: Release (TestFlight,
          # App Store) nimmt die feste Kennung oben und kennt diese Einstellung nicht. Ohne Angabe bleibt alles wie
          # bisher (Simulator, iPad, iPhone, Xcode).
          UF_DEBUG_BUNDLE_ID: de.uniflow.ai
          PRODUCT_BUNDLE_IDENTIFIER: $(UF_DEBUG_BUNDLE_ID)
          # CloudKit-Umgebung (UniFlow.entitlements, icloud-container-environment): Debug aus Xcode bleibt in Development
          UF_CLOUDKIT_ENVIRONMENT: Development
        # 14.11.2026 (Inhaber): ab Build 40 (1.0.4) auch die Universitaet Hildesheim; die HsH bleibt ausgeblendet.
        # 26.11.2026 (Inhaber): dazu die Uni Goettingen
        Release:
          UF_SHIPPED_UNIVERSITIES: "luh hildesheim goettingen"
          # Datei-Eingang aus (Inhaber 26.11.2026: "Eingang abschalten"). Der Dienst nimmt seit 26.11.2026 nichts mehr an
          # (LERNAPP_INTAKE_URL auskommentiert, 503 intake_off); 1.0.6 und 1.0.7 im Store waren mit YES gebaut.
          UF_INTAKE_OFFERED: "NO"
          # 20.11.2026: Release immer Production, auch per Kabel installiert (Entwickler-Profil). Vorher lief eine Kabel-Fassung
          # still auf Development: das iPad des Inhabers (1.0.6/1.0.7 per Kabel) sah eine andere Community als der Mac
          # (1.0.5 aus TestFlight). TestFlight und App Store waren schon immer Production (docs/paritaet/COMMUNITY-UND-ABGLEICH-2026-11-09.md 3.1).
          UF_CLOUDKIT_ENVIRONMENT: Production
    # Release fuer ein Geraet (Archiv fuer TestFlight/App Store) nur mit Team und Berechtigung "Mit Apple anmelden":
    # ohne Config/Team.xcconfig baute das Archiv still ohne die Berechtigung und die App blieb an der Begruessung haengen
    preBuildScripts:
      - name: "Release: Team und Mit Apple anmelden pruefen"
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" = "Release" ] && [ "${PLATFORM_NAME}" = "iphoneos" ]; then
            if [ -z "${DEVELOPMENT_TEAM}" ] || [ -z "${CODE_SIGN_ENTITLEMENTS}" ]; then
              echo "error: Release ohne DEVELOPMENT_TEAM oder CODE_SIGN_ENTITLEMENTS. Config/Team.xcconfig anlegen (Vorlage Team.xcconfig.example) und xcodegen generate ausfuehren."
              exit 1
            fi
          fi
    # Klartext-HTTP ins lokale Netz (eigener UniFlow-Server, nur Debug: Session.ownServerAvailable) und die Frage nach
    # dem lokalen Netz gibt es nur im Debug-Build. Release, TestFlight und App Store haben keine ATS-Ausnahme und keinen
    # Hinweis auf einen Server (docs/RELEASE-VORBEREITUNG.md, Abnahme: plutil -p auf die Info.plist im Archiv).
    postBuildScripts:
      - name: "Nur Debug: lokales Netz fuer den eigenen Server"
        basedOnDependencyAnalysis: false
        # Die Info.plist als Eingabe: so laeuft die Phase erst nach ProcessInfoPlistFile. Ohne diese Angabe hat Xcode
        # sie bei einem zweiten Testlauf in Folge davor eingeplant, die Plist wurde danach neu erzeugt und der
        # App-Test zum lokalen Netz schlug fehl (Befund 26.10.2026).
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          if [ "${CONFIGURATION}" = "Debug" ]; then
            P="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$P" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$P"
            /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$P" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string StudiNow verbindet sich mit deinem StudiNow-Server im WLAN (nur Entwicklung)." "$P"
          fi
    info:
      path: UniFlow/Info.plist
      properties:
        # Name auf dem Home-Bildschirm (Entscheidung des Inhabers 03.11.2026: die App heisst StudiNow, vorher Studora). Bundle-ID,
        # Produkt-IDs, Ordner und interne Kennungen bleiben bei uniflow, sonst gingen Daten und Einstellungen verloren.
        CFBundleDisplayName: StudiNow
        # Systemabfragen (z. B. Anmeldung ueber ASWebAuthenticationSession) nennen diesen Namen, nicht den Anzeigenamen
        CFBundleName: StudiNow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPhone: hoch ist Pflicht, quer erlaubt (die Seiten pruefen quer nur, dass nichts bricht); kopfueber wie
        # bei Apple-Apps nicht
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iCloud-Container der Community (leer ohne Config/Team.xcconfig; dann "Community nicht verfügbar")
        UFCloudKitContainer: $(UF_CLOUDKIT_CONTAINER)
        # Hochschulen zur Wahl in diesem Build (Release seit Build 40 "luh hildesheim", ab dem Build nach 50 mit
        # "goettingen", siehe UF_SHIPPED_UNIVERSITIES oben)
        UFShippedUniversities: $(UF_SHIPPED_UNIVERSITIES)
        # Datei-Eingang: seit 26.11.2026 in Release und Debug aus (UF_INTAKE_OFFERED oben; CourseFileIntakeSetting.isOffered)
        UFIntakeOffered: $(UF_INTAKE_OFFERED)
        # Schrift der Web-App (Inter, Google Fonts, SIL Open Font License: UniFlow/Resources/Fonts/Inter-OFL.txt)
        UIAppFonts:
          - Inter-Variable.ttf
        # Deep Links mit den Hash-Routen der Web-App, z. B. uniflow://#/plan?view=week
        CFBundleURLTypes:
          - CFBundleURLName: de.uniflow.ai
            CFBundleURLSchemes:
              - uniflow
        # Loesungspaket *.uniflowsolution (nur eigene Notizen, verschluesselt; docs/LOESUNGEN-TEILEN.md)
        CFBundleDocumentTypes:
          - CFBundleTypeName: StudiNow-Lösung
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - de.uniflow.solution
          # ZIP und PDF von aussen (07.11.2026): Dateien-App, Safari-Downloads, Mail ("Teilen" -> "In StudiNow öffnen");
          # iOS kopiert nach Documents/Inbox, UniFlowApp.onOpenURL -> ExternalFileImport ("In welches Modul?")
          - CFBundleTypeName: ZIP-Archiv
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.zip-archive
              - com.pkware.zip-archive
          - CFBundleTypeName: PDF-Dokument
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: de.uniflow.solution
            UTTypeDescription: StudiNow-Lösung
            UTTypeConformsTo:
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - uniflowsolution
              public.mime-type:
                - application/vnd.uniflow.solution+json
        # Dateien aus "Öffnen in" werden in die App kopiert (nicht an Ort und Stelle bearbeitet)
        LSSupportsOpeningDocumentsInPlace: false
        # "In neuem Fenster öffnen" (Uebung/Loesung als eigenes Fenster, 11.11.2026, Editor/DocumentWindows.swift)
        NSUserActivityTypes:
          - de.studinow.openDocument
        # Abgleich im Hintergrund (S8, UniFlow/Services/BackgroundSync.swift): kurzer Lauf (BGAppRefreshTask, nur
        # Listen) und langer mit Netz (BGProcessingTask, Downloads), beide fruehestens 8, 15 und 20 Uhr. Auch im Release
        # noetig; keine ATS-Ausnahme, kein Server, keine Push-Nachrichten.
        BGTaskSchedulerPermittedIdentifiers:
          - de.uniflow.ai.sync.refresh
          - de.uniflow.ai.sync.files
        UIBackgroundModes:
          - audio
          - fetch
          - processing
          # Weck-Signal (17.11.2026, WakePush.swift): "remote-notification" erst eintragen, wenn Push in der App-ID an ist
          # (1.0.6 ohne, Entscheidung 18.11.2026: kein Hintergrundmodus, den die App noch nicht nutzen kann)
        # Vorlesung aufnehmen (04.11.2026, docs/VORLESUNG-AUFNEHMEN.md): Mikrofon und Spracherkennung nur auf dem
        # Geraet, nur nach Antippen von "Aufnehmen"; "audio" oben haelt die Aufnahme bei gesperrtem Bildschirm am Laufen.
        # Aufnahme und Mitschrift verlassen das iPad nie (an die KI geht nur Text nach Antippen).
        # Spracherkennung auch fuer "Transkript erstellen" an Audiodateien (AudioTranscriber.swift, TextDocumentView):
        # der Text nennt beide Anlaesse (Audit P46-08, 08.11.2026; vorher nur die Vorlesungsaufnahme)
        NSMicrophoneUsageDescription: StudiNow nimmt mit dem Mikrofon Vorlesungen auf, wenn du „Aufnehmen“ antippst. Die Aufnahme bleibt auf diesem iPad.
        NSSpeechRecognitionUsageDescription: StudiNow schreibt Vorlesungsaufnahmen und Audiodateien, für die du „Transkript erstellen“ antippst, auf dem Gerät mit (Spracherkennung ohne Server). Der Text bleibt auf diesem iPad.
        # Konto loeschen nur durch die Besitzerin oder den Besitzer (24.11.2026, DeviceOwnerCheck.swift): Face ID fragt
        # vor dem Loeschen; ohne diesen Text beendet iOS die App bei der ersten Face-ID-Abfrage
        NSFaceIDUsageDescription: StudiNow fragt mit Face ID nach, bevor dein Konto gelöscht wird, damit das niemand anderes an deinem Gerät tun kann.
        # Teilen-Menues bieten "Bild sichern" an (QR-Code der Einladung, Downloads im In-App-Browser); ohne diesen Text
        # beendet iOS die App beim Antippen (Generalprobe 04.11.2026). Nur Hinzufuegen, nie Lesen der Fotos.
        NSPhotoLibraryAddUsageDescription: StudiNow sichert ein Bild, das du im Teilen-Menü mit „Bild sichern“ auswählst, in deinen Fotos.
        # Raumfinder (05.11.2026, docs/RAUMFINDER-2026-11-05.md): "In Google Maps öffnen" nimmt die Google-Maps-App, wenn
        # installiert (canOpenURL braucht den Eintrag), sonst die Webadresse; nichts geht an Google ohne Antippen
        LSApplicationQueriesSchemes:
          - comgooglemaps
        # Exportkontrolle (docs/release/APP-STORE.md "Weitere Angaben"): nur Verschluesselung des Betriebssystems (HTTPS
        # ueber URLSession, AES-GCM/HKDF aus CryptoKit), keine eigene Krypto-Bibliothek -> keine Dokumente noetig
        ITSAppUsesNonExemptEncryption: false
        # kein NSAppTransportSecurity: nur HTTPS (Stud.IP, Learnweb, LSF, Opencast); Debug siehe postBuildScripts
  # Widgets (23.11.2026, docs/WIDGETS-2026-11-23.md): "Nächster Termin" und "Mensa heute". Liest nur den Schnappschuss
  # der App aus der App-Gruppe group.de.uniflow.ai, geht nie ins Netz. Kennung = Kennung der App + ".widgets" (Debug
  # folgt UF_DEBUG_BUNDLE_ID, damit tools/mac-test.sh auch hier die Test-Kennung nimmt).
  StudiNowWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: StudiNowWidgets
      - path: WidgetShared
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.uniflow.ai.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        CODE_SIGN_STYLE: Automatic
        # eigene Berechtigung (nur App-Gruppe); Team.xcconfig setzt sonst die der App
        CODE_SIGN_ENTITLEMENTS: StudiNowWidgets/StudiNowWidgets.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      configs:
        Debug:
          UF_DEBUG_BUNDLE_ID: de.uniflow.ai
          PRODUCT_BUNDLE_IDENTIFIER: $(UF_DEBUG_BUNDLE_ID).widgets
    info:
      path: StudiNowWidgets/Info.plist
      properties:
        CFBundleDisplayName: StudiNow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  UniFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UniFlowTests
        excludes:
          - "*.storekit"
      - path: UniFlowTests/UniFlow.storekit
        buildPhase: resources       # SKTestSession(configurationFileNamed:) sucht die Datei im Testbundle
      # Ansichten der Widgets fuer die Bilder in WidgetSnapshotAppTests (Datenformat kommt ueber @testable import UniFlow)
      - path: StudiNowWidgets/WidgetViews.swift
      # alle vier Tarife, nur fuer die Tests der Wechsel-Logik (Pro-Tarife kommen erst mit dem StudiNow-Dienst)
      - path: UniFlowTests/UniFlowAlleTarife.storekit
        buildPhase: resources
      # Stub-Ordner und Vertrags-Fixtures auch im Testbundle: auf dem Mac ("Designed for iPad") laeuft die App in der
      # Sandbox und darf den Repo-Ordner nicht lesen (Befund 08.11.2026); ContainerTestBed.repoURL faellt darauf zurueck
      - path: DebugStub/erststart
        type: folder
        buildPhase: resources
      # Nachbildung des Stud.IP der Uni Goettingen (tools/build-goettingen-stub.py), fuer GoettingenAppTests
      - path: DebugStub/goettingen
        type: folder
        buildPhase: resources
      - path: ../../packages/shared-contracts/fixtures
        type: folder
        buildPhase: resources
      # Lernseiten-Vertrag auch im Testbundle (VideoLearningSitesAppTests vergleicht ihn am Mac mit dem Grundstock der App)
      - path: ../../packages/shared-contracts/learning-sites.json
        buildPhase: resources
    dependencies:
      - target: UniFlow
      - package: UniFlowCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.uniflow.ai.tests
        GENERATE_INFOPLIST_FILE: YES
        # StudiNowWidgets/WidgetViews.swift im Testbundle holt das Datenformat ueber @testable import UniFlow
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) UF_WIDGET_VIEWS_IN_TESTS"
        # iPhone-Simulator: Szene regular wie am iPad, damit die Tests in iPad-Groesse die breite Fassung sehen
        # (UniFlowTests/TestBundlePrincipal.swift); auf dem iPad ohne Wirkung
        INFOPLIST_KEY_NSPrincipalClass: UniFlowTestsPrincipal

  # echte Beruehrungen (XCUITest) fuer Fehler, die Tests ueber die Bedienungshilfen nicht sehen (13.11.2026: "+ Seite"
  # im Blatt daneben); laeuft nicht in der Suite `-only-testing:UniFlowTests`
  UniFlowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UniFlowUITests
    dependencies:
      - target: UniFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.uniflow.ai.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: UniFlow
schemes:
  UniFlow:
    build:
      targets:
        UniFlow: all
        UniFlowTests: [test]
        UniFlowUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: UniFlowTests
        - name: UniFlowUITests
    run:
      config: Debug
      # nur lokales StoreKit-Testen in Xcode; echte Produkte erst nach Freigabe
      storeKitConfiguration: UniFlowTests/UniFlow.storekit
