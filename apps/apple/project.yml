# XcodeGen-Projektbeschreibung. Mac: `brew install xcodegen && xcodegen generate`, dann UniFlow.xcodeproj oeffnen.
# CI: .github/workflows/apple.yml erzeugt das Projekt genauso und baut/testet ohne Signierung im Simulator.
name: UniFlow
options:
  bundleIdPrefix: de.uniflow
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
packages:
  UniFlowCore:
    path: Packages/UniFlowCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  UniFlow:
    type: application
    platform: iOS
    sources:
      - path: UniFlow
    dependencies:
      - package: UniFlowCore
    # Team und "Mit Apple anmelden" nur mit der nicht eingecheckten Config/Team.xcconfig (siehe Config/Base.xcconfig)
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.uniflow.ai
        TARGETED_DEVICE_FAMILY: "2"           # nur iPad (V1, Auftrag Abschnitt 2 Punkt 5)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: UniFlow/Info.plist
      properties:
        CFBundleDisplayName: UniFlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: UniFlow verbindet sich mit deinem UniFlow-Server im WLAN.
        # iCloud-Container der Community (leer ohne Config/Team.xcconfig; dann "Community nicht verfügbar")
        UFCloudKitContainer: $(UF_CLOUDKIT_CONTAINER)
        # Schrift der Web-App (Inter, Google Fonts, SIL Open Font License: UniFlow/Resources/Fonts/Inter-OFL.txt)
        UIAppFonts:
          - Inter-Variable.ttf
        # Deep Links mit den Hash-Routen der Web-App, z. B. uniflow://#/plan?view=week
        CFBundleURLTypes:
          - CFBundleURLName: de.uniflow.ai
            CFBundleURLSchemes:
              - uniflow
        # Loesungspaket *.uniflowsolution (nur eigene Notizen, verschluesselt; docs/LOESUNGEN-TEILEN.md)
        CFBundleDocumentTypes:
          - CFBundleTypeName: UniFlow-Lösung
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - de.uniflow.solution
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: de.uniflow.solution
            UTTypeDescription: UniFlow-Lösung
            UTTypeConformsTo:
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - uniflowsolution
              public.mime-type:
                - application/vnd.uniflow.solution+json
        # Dateien aus "Öffnen in" werden in die App kopiert (nicht an Ort und Stelle bearbeitet)
        LSSupportsOpeningDocumentsInPlace: false
        # Nur fuer die Entwicklung (Server laeuft per http im WLAN). Vor TestFlight/App Store auf HTTPS umstellen und entfernen.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
  UniFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UniFlowTests
        excludes:
          - "*.storekit"
      - path: UniFlowTests/UniFlow.storekit
        buildPhase: resources       # SKTestSession(configurationFileNamed:) sucht die Datei im Testbundle
    dependencies:
      - target: UniFlow
      - package: UniFlowCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.uniflow.ai.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  UniFlow:
    build:
      targets:
        UniFlow: all
        UniFlowTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: UniFlowTests
    run:
      config: Debug
      # nur lokales StoreKit-Testen in Xcode; echte Produkte erst nach Freigabe
      storeKitConfiguration: UniFlowTests/UniFlow.storekit
