# XcodeGen-Projektbeschreibung. Mac: `brew install xcodegen && xcodegen generate`, dann UniFlow.xcodeproj oeffnen.
# CI: .github/workflows/apple.yml erzeugt das Projekt genauso und baut/testet ohne Signierung im Simulator.
name: UniFlow
options:
  bundleIdPrefix: de.uniflow
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
packages:
  UniFlowCore:
    path: Packages/UniFlowCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    # App Store 1.0.1 (Build 30 eingereicht am 10.11.2026; 1.0 mit Build 25 wurde nie veroeffentlicht); Build 31 ist 1.0.2. Build-Nummer: eine fortlaufende ganze Zahl ueber alle Uploads hinweg,
    # je Upload +1, nie zurueck (0.2.0 hatte Build 2). Neue Version (1.0.1, 1.1) -> MARKETING_VERSION, Build weiterzaehlen.
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "31"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  UniFlow:
    type: application
    platform: iOS
    sources:
      - path: UniFlow
    dependencies:
      - package: UniFlowCore
    # Team und "Mit Apple anmelden" nur mit der nicht eingecheckten Config/Team.xcconfig (siehe Config/Base.xcconfig)
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.uniflow.ai
        TARGETED_DEVICE_FAMILY: "2"           # nur iPad (V1, Auftrag Abschnitt 2 Punkt 5)
        # Mac ueber die iPad-App ("Designed for iPad", Entscheidung 28.10.): kein eigener Mac-Build; freigeschaltet wird
        # es in App Store Connect (Preise und Verfuegbarkeit -> iPhone- und iPad-Apps auf Apple-Silicon-Macs)
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        # die Skriptphase "Nur Debug: lokales Netz" schreibt in die Info.plist des Bundles (unten)
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        # Ausgelieferte Hochschulen (Info.plist UFShippedUniversities, UFReleaseUniversities im Kern). Entscheidung des
        # Inhabers 07.11.2026: Version 1.0 (Build 16) nur die LUH; HsH und Uni Hildesheim bleiben im Code und kommen mit
        # 1.0.1 - dann Release auf "luh hildesheim hsh" setzen. Debug und Tests sehen alle drei.
        Debug:
          UF_SHIPPED_UNIVERSITIES: "luh hildesheim hsh"
        Release:
          UF_SHIPPED_UNIVERSITIES: "luh"
    # Release fuer ein Geraet (Archiv fuer TestFlight/App Store) nur mit Team und Berechtigung "Mit Apple anmelden":
    # ohne Config/Team.xcconfig baute das Archiv still ohne die Berechtigung und die App blieb an der Begruessung haengen
    preBuildScripts:
      - name: "Release: Team und Mit Apple anmelden pruefen"
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" = "Release" ] && [ "${PLATFORM_NAME}" = "iphoneos" ]; then
            if [ -z "${DEVELOPMENT_TEAM}" ] || [ -z "${CODE_SIGN_ENTITLEMENTS}" ]; then
              echo "error: Release ohne DEVELOPMENT_TEAM oder CODE_SIGN_ENTITLEMENTS. Config/Team.xcconfig anlegen (Vorlage Team.xcconfig.example) und xcodegen generate ausfuehren."
              exit 1
            fi
          fi
    # Klartext-HTTP ins lokale Netz (eigener UniFlow-Server, nur Debug: Session.ownServerAvailable) und die Frage nach
    # dem lokalen Netz gibt es nur im Debug-Build. Release, TestFlight und App Store haben keine ATS-Ausnahme und keinen
    # Hinweis auf einen Server (docs/RELEASE-VORBEREITUNG.md, Abnahme: plutil -p auf die Info.plist im Archiv).
    postBuildScripts:
      - name: "Nur Debug: lokales Netz fuer den eigenen Server"
        basedOnDependencyAnalysis: false
        # Die Info.plist als Eingabe: so laeuft die Phase erst nach ProcessInfoPlistFile. Ohne diese Angabe hat Xcode
        # sie bei einem zweiten Testlauf in Folge davor eingeplant, die Plist wurde danach neu erzeugt und der
        # App-Test zum lokalen Netz schlug fehl (Befund 26.10.2026).
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          if [ "${CONFIGURATION}" = "Debug" ]; then
            P="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$P" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$P"
            /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$P" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string StudiNow verbindet sich mit deinem StudiNow-Server im WLAN (nur Entwicklung)." "$P"
          fi
    info:
      path: UniFlow/Info.plist
      properties:
        # Name auf dem Home-Bildschirm (Entscheidung des Inhabers 03.11.2026: die App heisst StudiNow, vorher Studora). Bundle-ID,
        # Produkt-IDs, Ordner und interne Kennungen bleiben bei uniflow, sonst gingen Daten und Einstellungen verloren.
        CFBundleDisplayName: StudiNow
        # Systemabfragen (z. B. Anmeldung ueber ASWebAuthenticationSession) nennen diesen Namen, nicht den Anzeigenamen
        CFBundleName: StudiNow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iCloud-Container der Community (leer ohne Config/Team.xcconfig; dann "Community nicht verfügbar")
        UFCloudKitContainer: $(UF_CLOUDKIT_CONTAINER)
        # Hochschulen zur Wahl in diesem Build (Release nur "luh", siehe UF_SHIPPED_UNIVERSITIES oben)
        UFShippedUniversities: $(UF_SHIPPED_UNIVERSITIES)
        # Schrift der Web-App (Inter, Google Fonts, SIL Open Font License: UniFlow/Resources/Fonts/Inter-OFL.txt)
        UIAppFonts:
          - Inter-Variable.ttf
        # Deep Links mit den Hash-Routen der Web-App, z. B. uniflow://#/plan?view=week
        CFBundleURLTypes:
          - CFBundleURLName: de.uniflow.ai
            CFBundleURLSchemes:
              - uniflow
        # Loesungspaket *.uniflowsolution (nur eigene Notizen, verschluesselt; docs/LOESUNGEN-TEILEN.md)
        CFBundleDocumentTypes:
          - CFBundleTypeName: StudiNow-Lösung
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - de.uniflow.solution
          # ZIP und PDF von aussen (07.11.2026): Dateien-App, Safari-Downloads, Mail ("Teilen" -> "In StudiNow öffnen");
          # iOS kopiert nach Documents/Inbox, UniFlowApp.onOpenURL -> ExternalFileImport ("In welches Modul?")
          - CFBundleTypeName: ZIP-Archiv
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.zip-archive
              - com.pkware.zip-archive
          - CFBundleTypeName: PDF-Dokument
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: de.uniflow.solution
            UTTypeDescription: StudiNow-Lösung
            UTTypeConformsTo:
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - uniflowsolution
              public.mime-type:
                - application/vnd.uniflow.solution+json
        # Dateien aus "Öffnen in" werden in die App kopiert (nicht an Ort und Stelle bearbeitet)
        LSSupportsOpeningDocumentsInPlace: false
        # Abgleich im Hintergrund (S8, UniFlow/Services/BackgroundSync.swift): kurzer Lauf (BGAppRefreshTask, nur
        # Listen) und langer mit Netz (BGProcessingTask, Downloads), beide fruehestens 8, 15 und 20 Uhr. Auch im Release
        # noetig; keine ATS-Ausnahme, kein Server, keine Push-Nachrichten.
        BGTaskSchedulerPermittedIdentifiers:
          - de.uniflow.ai.sync.refresh
          - de.uniflow.ai.sync.files
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        # Vorlesung aufnehmen (04.11.2026, docs/VORLESUNG-AUFNEHMEN.md): Mikrofon und Spracherkennung nur auf dem
        # Geraet, nur nach Antippen von "Aufnehmen"; "audio" oben haelt die Aufnahme bei gesperrtem Bildschirm am Laufen.
        # Aufnahme und Mitschrift verlassen das iPad nie (an die KI geht nur Text nach Antippen).
        # Spracherkennung auch fuer "Transkript erstellen" an Audiodateien (AudioTranscriber.swift, TextDocumentView):
        # der Text nennt beide Anlaesse (Audit P46-08, 08.11.2026; vorher nur die Vorlesungsaufnahme)
        NSMicrophoneUsageDescription: StudiNow nimmt mit dem Mikrofon Vorlesungen auf, wenn du „Aufnehmen“ antippst. Die Aufnahme bleibt auf diesem iPad.
        NSSpeechRecognitionUsageDescription: StudiNow schreibt Vorlesungsaufnahmen und Audiodateien, für die du „Transkript erstellen“ antippst, auf dem Gerät mit (Spracherkennung ohne Server). Der Text bleibt auf diesem iPad.
        # Teilen-Menues bieten "Bild sichern" an (QR-Code der Einladung, Downloads im In-App-Browser); ohne diesen Text
        # beendet iOS die App beim Antippen (Generalprobe 04.11.2026). Nur Hinzufuegen, nie Lesen der Fotos.
        NSPhotoLibraryAddUsageDescription: StudiNow sichert ein Bild, das du im Teilen-Menü mit „Bild sichern“ auswählst, in deinen Fotos.
        # Raumfinder (05.11.2026, docs/RAUMFINDER-2026-11-05.md): "In Google Maps öffnen" nimmt die Google-Maps-App, wenn
        # installiert (canOpenURL braucht den Eintrag), sonst die Webadresse; nichts geht an Google ohne Antippen
        LSApplicationQueriesSchemes:
          - comgooglemaps
        # Exportkontrolle (docs/release/APP-STORE.md "Weitere Angaben"): nur Verschluesselung des Betriebssystems (HTTPS
        # ueber URLSession, AES-GCM/HKDF aus CryptoKit), keine eigene Krypto-Bibliothek -> keine Dokumente noetig
        ITSAppUsesNonExemptEncryption: false
        # kein NSAppTransportSecurity: nur HTTPS (Stud.IP, Learnweb, LSF, Opencast); Debug siehe postBuildScripts
  UniFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UniFlowTests
        excludes:
          - "*.storekit"
      - path: UniFlowTests/UniFlow.storekit
        buildPhase: resources       # SKTestSession(configurationFileNamed:) sucht die Datei im Testbundle
      # alle vier Tarife, nur fuer die Tests der Wechsel-Logik (Pro-Tarife kommen erst mit dem StudiNow-Dienst)
      - path: UniFlowTests/UniFlowAlleTarife.storekit
        buildPhase: resources
      # Stub-Ordner und Vertrags-Fixtures auch im Testbundle: auf dem Mac ("Designed for iPad") laeuft die App in der
      # Sandbox und darf den Repo-Ordner nicht lesen (Befund 08.11.2026); ContainerTestBed.repoURL faellt darauf zurueck
      - path: DebugStub/erststart
        type: folder
        buildPhase: resources
      - path: ../../packages/shared-contracts/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: UniFlow
      - package: UniFlowCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.uniflow.ai.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  UniFlow:
    build:
      targets:
        UniFlow: all
        UniFlowTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: UniFlowTests
    run:
      config: Debug
      # nur lokales StoreKit-Testen in Xcode; echte Produkte erst nach Freigabe
      storeKitConfiguration: UniFlowTests/UniFlow.storekit
