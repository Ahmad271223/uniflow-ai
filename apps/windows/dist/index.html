<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniFlow</title>
<style>
  body { font: 16px/1.5 system-ui, "Segoe UI", sans-serif; margin: 0; display: grid; place-items: center; min-height: 100vh; background: #f6f7fb; color: #171a26; }
  @media (prefers-color-scheme: dark) { body { background: #14151c; color: #e8e9f0; } .card { background: #1d1f29 !important; border-color: #2c2f3d !important; } }
  .card { background: #fff; border: 1px solid #e5e8f0; border-radius: 16px; padding: 1.6rem 2rem; max-width: 460px; }
  h1 { font-size: 1.3rem; margin: 0 0 .4rem; color: #6d4ae0; }
  code { background: rgba(109,74,224,.1); padding: .1rem .35rem; border-radius: 6px; }
  button { margin-top: 1rem; padding: .6rem 1.2rem; border: 0; border-radius: 10px; background: #6d4ae0; color: #fff; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <h1>UniFlow</h1>
  <p id="msg">Verbinde mit dem UniFlow-Server auf diesem PC …</p>
  <p id="help" hidden>Der Server läuft nicht. Bitte im Projektordner <code>Start-iPad.cmd</code> oder
     <code>.venv\Scripts\python.exe serve.py</code> starten und dann erneut versuchen.</p>
  <button id="retry" hidden>Erneut versuchen</button>
</div>
<script>
  // Die Oberflaeche kommt vom lokalen Server (gleiche Dateien wie im Browser); diese Seite prueft nur, ob er laeuft.
  const SERVER = "http://127.0.0.1:8765/";
  async function connect() {
    document.getElementById("msg").textContent = "Verbinde mit dem UniFlow-Server auf diesem PC …";
    try {
      await fetch(SERVER + "api/network", { mode: "no-cors", cache: "no-store" });
      location.replace(SERVER);
    } catch {
      document.getElementById("msg").textContent = "Keine Verbindung zu " + SERVER;
      document.getElementById("help").hidden = false;
      document.getElementById("retry").hidden = false;
    }
  }
  document.getElementById("retry").onclick = connect;
  connect();
</script>
</body>
</html>
