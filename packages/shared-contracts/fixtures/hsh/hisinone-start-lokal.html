<!DOCTYPE html>
<!-- NACHGEBAUT (keine echte Seite): HISinOne-Startseite der HsH ohne Anmeldung im Aufbau vom 07.11.2026 (ohne Anmeldung gelesen): verstecktes #mobileLoginForm (asdf/fdsa), Knopf "Zur Anmeldung" (…:overlayShowButton) blendet das eigene Formular ein, daneben "Anmelden mit SSO", verstecktes Dialogfeld. Werte erfunden. -->
<html lang="de"><head><meta charset="utf-8"><title>Startseite - Hochschule Hannover</title><style>.noDisplay{display:none}</style></head><body>
<form method="post" id="mobileLoginForm" name="mobileLoginForm" action="https://campusmanagement.hs-hannover.de:443/qisserver/rds?state=user&amp;type=1&amp;category=auth.login" class="noDisplay"><label for="loginName">Benutzerkennung</label><input id="loginName" name="asdf" type="text" autocomplete="off"/><label for="loginPassword">Passwort</label><input id="loginPassword" name="fdsa" type="password" autocomplete="off"/><button type="submit" name="submit">Anmelden</button></form>
<header><div id="loginLinkElement" class="loginLink">
<form id="widgetRender:8:formLoginOverlay" method="post" action="/qisserver/pages/cs/sys/portal/hisinoneStartPage.faces"><button id="widgetRender:8:formLoginOverlay:new_login_overlay:overlayShowButton" type="submit" class="login_overlay_button" onclick="document.getElementById('overlayPlaceholder').innerHTML = document.getElementById('overlayTemplate').innerHTML; return false;">Zur Anmeldung</button></form>
<div id="overlayPlaceholder"></div>
</div></header>
<template id="overlayTemplate"><form id="loginForm" name="loginform" method="post" action="https://campusmanagement.hs-hannover.de:443/qisserver/rds?state=user&amp;type=1&amp;category=auth.login"><label for="asdf">Benutzerkennung</label><input type="text" id="asdf" name="asdf"/><label for="fdsa">Passwort</label><input type="password" id="fdsa" name="fdsa"/><button type="submit" name="submit" id="loginForm:login">Anmelden</button><a href="/qisserver/api/identityprovider/redirect/4/login">Anmelden mit SSO Hochschule Hannover</a></form></template>
<main><p class="buttonStudierende"><strong>Studierende</strong> Sie können sich über den Accountmanager Ihren SSO-Account abrufen und sich mit diesem hier anmelden.</p></main>
<div id="sessionTimeoutDialog" style="display:none" aria-hidden="true"><form action="/qisserver/rds?state=user&amp;type=1&amp;category=auth.login" method="post"><input type="text" name="asdf"/><input type="password" name="fdsa"/><button type="submit">Anmelden</button></form></div>
</body></html>
